<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matiku LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Animations */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-in-out;
        }
        
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-in-out;
        }
        
        @keyframes slide-in-left {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fade-out-left {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-20px); }
        }
        @keyframes fade-out-right {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(20px); }
        }
        .animate-slide-in-left { animation: slide-in-left 0.3s ease-out; }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
        .animate-fade-out-left { animation: fade-out-left 0.3s ease-in; }
        .animate-fade-out-right { animation: fade-out-right 0.3s ease-in; }

        @keyframes grow-width {
            from { width: 0%; }
            to { width: var(--target-width); }
        }
        .animate-grow-width {
            animation: grow-width 0.8s ease-out forwards;
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .animate-pulse-logo {
            animation: pulse-logo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes zoom-in-fade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-zoom-in-fade {
            animation: zoom-in-fade 0.4s ease-out forwards;
        }

        @keyframes fade-in-form {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in-form {
            animation: fade-in-form 0.3s ease-out forwards;
        }

        @keyframes fade-out-form {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-out-form {
            animation: fade-out-form 0.3s ease-in forwards;
        }

        /* Math Canvas Animations */
        @keyframes math-float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-20px) rotate(5deg); opacity: 0.3; }
        }
        .animate-math-float { animation: math-float 6s ease-in-out infinite; }

        @keyframes draw-line {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
        .animate-draw-line {
            stroke-dasharray: 1000;
            animation: draw-line 2s ease-in-out forwards;
        }

        @keyframes grid-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .animate-grid-glow { animation: grid-glow 3s ease-in-out infinite; }

        /* Math background symbols */
        .math-bg-symbol {
            position: fixed;
            font-size: 2rem;
            color: rgba(59, 130, 246, 0.15);
            pointer-events: none;
            user-select: none;
            animation: math-float 8s ease-in-out infinite;
            z-index: 0;
        }
    </style>

    <!-- PDF Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- MathLive for WYSIWYG Math Input -->
    <script defer src="https://unpkg.com/mathlive"></script>
</head>
<body>
    <!-- Math background symbols (restored) -->
    <span class="math-bg-symbol" style="top: 5%; left: 2%; animation-delay: 0s;">∑</span>
    <span class="math-bg-symbol" style="top: 10%; left: 6%; animation-delay: 0.5s;">π</span>
    <span class="math-bg-symbol" style="top: 20%; left: 1%; animation-delay: 1s;">√</span>
    <span class="math-bg-symbol" style="top: 30%; left: 5%; animation-delay: 1.5s;">∞</span>
    <span class="math-bg-symbol" style="top: 40%; left: 2%; animation-delay: 2s;">Δ</span>
    <span class="math-bg-symbol" style="top: 50%; left: 7%; animation-delay: 2.5s;">θ</span>
    <span class="math-bg-symbol" style="top: 60%; left: 1%; animation-delay: 3s;">λ</span>
    <span class="math-bg-symbol" style="top: 70%; left: 4%; animation-delay: 0.8s;">∂</span>
    <span class="math-bg-symbol" style="top: 80%; left: 8%; animation-delay: 1.3s;">α</span>
    <span class="math-bg-symbol" style="top: 90%; left: 2%; animation-delay: 1.8s;">β</span>
    <span class="math-bg-symbol" style="top: 15%; left: 10%; animation-delay: 2.3s;">γ</span>
    <span class="math-bg-symbol" style="top: 25%; left: 12%; animation-delay: 0.3s;">φ</span>
    <span class="math-bg-symbol" style="top: 35%; left: 9%; animation-delay: 1.1s;">±</span>
    <span class="math-bg-symbol" style="top: 45%; left: 11%; animation-delay: 2.1s;">÷</span>
    <span class="math-bg-symbol" style="top: 55%; left: 10%; animation-delay: 0.7s;">×</span>
    <span class="math-bg-symbol" style="top: 65%; left: 13%; animation-delay: 1.6s;">≈</span>
    <span class="math-bg-symbol" style="top: 75%; left: 9%; animation-delay: 2.6s;">≠</span>
    <span class="math-bg-symbol" style="top: 85%; left: 12%; animation-delay: 0.4s;">∈</span>
    <span class="math-bg-symbol" style="top: 95%; left: 10%; animation-delay: 1.9s;">∀</span>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
